<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 1. SVG 지원 브라우저 (크롬, 파이어폭스, 최신 모바일 등) -->

    <!-- 2. PNG 지원 브라우저 / 구형 환경 / 백업용 파비콘 -->

    <!-- 3. iOS 아이폰 홈 화면 추가 아이콘 (PNG 권장) -->
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webtoon-manager</title>
  </head>
